<article class="console-panel level-zone-rules">
  <header><div><span>{{ .number }}</span><h2>Zone rules</h2></div><small{{ if .rules.modified }} class="zone-rule-status is-modified"{{ end }}>{{ if .rules.modified }}Mission override{{ else }}Default rules{{ end }}</small></header>
  <div class="zone-rule-groups">
    {{ range .rules.groups }}
    <section>
      <h3>{{ .name }}</h3>
      <dl>
        {{ range .rows }}
        <div{{ if .changed }} class="is-modified"{{ end }}>
          <dt>{{ .label }}</dt>
          <dd><strong>{{ .value }}</strong>{{ if .changed }}<small><span>Modified</span> · Default: {{ .default }}</small>{{ end }}</dd>
        </div>
        {{ end }}
      </dl>
    </section>
    {{ end }}
  </div>
</article>
