{{ define "main" }}
{{ $data := site.Data.generated.npc }}
<header class="page-hero">
  <div>
    <p class="eyebrow"><a href="{{ "/" | strings.TrimPrefix "/" | relURL }}">SYSTEM</a> // ENEMY GLOSSARY</p>
    <h1>{{ .Title }}</h1>
    <p>{{ .Description }}</p>
  </div>
  <div class="page-counter"><strong>{{ $data.entry_count }}</strong><span>CREATURES &<br>DESTRUCTABLES</span></div>
</header>

{{ partial "npc-difficulty.html" . }}
<section class="control-rack compact" aria-label="Enemy search">
  <label class="search-control"><span>SEARCH ENEMIES</span><input type="search" placeholder="Creature or noun name…" data-npc-search="{{ "/data/npc/index.json" | strings.TrimPrefix "/" | relURL }}" data-total="{{ $data.entry_count }}"></label>
  <label class="search-control"><span>ELEMENT / TYPE</span><select data-npc-type aria-label="Filter creatures by element or destructables"><option value="all">All creatures & destructables</option><option value="bio">Bio</option><option value="cyber">Cyber</option><option value="plasma">Plasma</option><option value="quantum">Quantum</option><option value="necro">Necro</option><option value="destructables">Destructables</option></select></label>
</section>
<div class="result-line"><span data-result-count>{{ $data.entry_count }}</span> creatures & destructables indexed <i></i></div>

<section class="npc-search-results" data-npc-search-results>
  <div role="table" aria-label="Enemies">
    <div class="npc-table-head" role="row"><span role="columnheader" aria-label="Portrait"></span><span role="columnheader">Enemy</span><span role="columnheader">HP</span><span role="columnheader">Tags</span></div>
    <div class="npc-table" role="rowgroup" data-npc-results></div>
  </div>
  <p class="result-limit" data-result-limit hidden></p>
</section>

<template id="npc-row-template">
  <div class="npc-row" role="row">
    <span class="npc-portrait" role="cell" data-field="portrait"></span>
    <span role="cell"><a class="npc-name" data-field="name"></a></span>
    <span class="hp-readout" role="cell" data-field="hp"></span>
    <span class="source-tags" role="cell" data-field="source"></span>
  </div>
</template>
{{ end }}
